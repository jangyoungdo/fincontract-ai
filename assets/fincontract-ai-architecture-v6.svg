<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1500" viewBox="0 0 1920 1500" role="img" aria-labelledby="title desc">
  <title id="title">FinContract AI EC2 시스템 아키텍처</title>
  <desc id="desc">사용자 및 개발자 접근, EC2 Docker 서비스, RAG 근거 검색, 오프라인 E5 후보 탐지와 OpenAI 보강의 구분을 보여주는 시스템 흐름도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <style>
      .bg{fill:#f8fafc}.title{font:700 42px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#0f172a}.subtitle{font:400 20px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#475569}
      .lane-title{font:700 22px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#0f172a}.node-title{font:700 18px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#0f172a}.node-text{font:400 14px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#334155}.small{font:400 13px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#475569}.tiny{font:400 12px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#64748b}.status{font:700 13px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
      .lane{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:20}.actor{fill:#faf5ff;stroke:#8b5cf6;stroke-width:2;rx:14}.edge{fill:#ecfeff;stroke:#06b6d4;stroke-width:2;rx:14}.compute{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14}.data{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:14}.rag{fill:#f0fdf4;stroke:#22c55e;stroke-width:2;rx:14}.external{fill:#fef2f2;stroke:#ef4444;stroke-width:2;stroke-dasharray:8 6;rx:14}.host{fill:#f8fafc;stroke:#2563eb;stroke-width:2.5;rx:18}.docker{fill:#fff;stroke:#f97316;stroke-width:2;stroke-dasharray:9 6;rx:16}
      .arrow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.green-arrow{fill:none;stroke:#15803d;stroke-width:2.5;marker-end:url(#green-arrow)}.dashed{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="bg" width="1920" height="1500"/>
  <text x="70" y="65" class="title">FinContract AI EC2 시스템 아키텍처</text>
  <text x="70" y="99" class="subtitle">사용자 흐름 · Docker 실행 경계 · RAG 근거 검색 · OpenAI 보강</text>

  <g transform="translate(1280 45)">
    <rect width="140" height="38" class="actor"/><circle cx="18" cy="19" r="6" fill="#8b5cf6"/><text x="32" y="25" class="status" fill="#6d28d9">사람·외부</text>
    <rect x="155" width="140" height="38" class="compute"/><circle cx="173" cy="19" r="6" fill="#f97316"/><text x="187" y="25" class="status" fill="#9a3412">실행 서비스</text>
    <rect x="310" width="140" height="38" class="rag"/><circle cx="328" cy="19" r="6" fill="#22c55e"/><text x="342" y="25" class="status" fill="#166534">RAG·검증</text>
    <rect x="465" width="140" height="38" class="data"/><circle cx="483" cy="19" r="6" fill="#3b82f6"/><text x="497" y="25" class="status" fill="#1d4ed8">데이터</text>
  </g>

  <!-- Interaction -->
  <rect x="50" y="125" width="1820" height="205" class="lane" filter="url(#shadow)"/>
  <text x="80" y="165" class="lane-title">1. 사용자와 개발자의 진입 경로</text>

  <g transform="translate(85 190)">
    <rect width="310" height="105" class="actor"/>
    <text x="20" y="31" class="node-title">서비스 사용자 · 브라우저</text>
    <text x="20" y="59" class="node-text">업로드 → 진행 상태 → 결과·PDF</text>
    <text x="20" y="84" class="status" fill="#6d28d9">마스킹된 화면만 제공</text>
  </g>
  <path d="M395 242H445" class="arrow"/>
  <g transform="translate(445 190)">
    <rect width="280" height="105" class="edge"/>
    <text x="20" y="31" class="node-title">ngrok HTTPS</text>
    <text x="20" y="59" class="node-text">공개 URL → EC2 Frontend :3000</text>
    <text x="20" y="84" class="status" fill="#0e7490">systemd 자동 재시작</text>
  </g>

  <g transform="translate(900 190)">
    <rect width="320" height="105" class="actor"/>
    <text x="20" y="31" class="node-title">개발자 Mac</text>
    <text x="20" y="59" class="node-text">코드 수정·테스트·push</text>
    <text x="20" y="84" class="status" fill="#6d28d9">aws login → ssh fincontract-prod</text>
  </g>
  <path d="M1220 242H1270" class="arrow"/>
  <g transform="translate(1270 190)">
    <rect width="520" height="105" class="edge"/>
    <text x="20" y="31" class="node-title">GitHub + AWS SSM</text>
    <text x="20" y="59" class="node-text">GitHub: 소스 버전 · SSM: 인바운드 22 없는 관리 채널</text>
    <text x="20" y="84" class="status" fill="#0e7490">git pull --ff-only → Docker 재배포</text>
  </g>

  <!-- Runtime -->
  <rect x="50" y="355" width="1820" height="435" class="lane" filter="url(#shadow)"/>
  <text x="80" y="395" class="lane-title">2. AWS EC2 · Ubuntu 26.04 LTS · Docker Compose</text>
  <text x="80" y="421" class="small">서울 리전 · 2 vCPU · 8 GiB RAM · 40 GiB gp3 · 2 GiB Swap</text>

  <rect x="75" y="445" width="1425" height="315" class="host"/>
  <text x="100" y="475" class="small">EC2 내부 Docker 네트워크</text>
  <rect x="95" y="490" width="1385" height="245" class="docker"/>

  <g transform="translate(120 520)"><rect width="205" height="105" class="compute"/><text x="18" y="31" class="node-title">Caddy</text><text x="18" y="58" class="node-text">Elastic IP :80</text><text x="18" y="83" class="small">정식 도메인 후 HTTPS</text></g>
  <path d="M325 572H365" class="arrow"/>
  <g transform="translate(365 520)"><rect width="230" height="105" class="compute"/><text x="18" y="31" class="node-title">Next.js Frontend</text><text x="18" y="58" class="node-text">화면 + /api/v1 proxy</text><text x="18" y="83" class="status" fill="#9a3412">127.0.0.1:3000</text></g>
  <path d="M595 572H635" class="arrow"/>
  <g transform="translate(635 520)"><rect width="230" height="105" class="compute"/><text x="18" y="31" class="node-title">FastAPI Backend</text><text x="18" y="58" class="node-text">검증·저장·작업 생성</text><text x="18" y="83" class="status" fill="#9a3412">healthy · :8000</text></g>
  <path d="M865 572H905" class="arrow"/>
  <g transform="translate(905 520)"><rect width="190" height="105" class="compute"/><text x="18" y="31" class="node-title">Redis Queue</text><text x="18" y="58" class="node-text">analysis ID만 전달</text><text x="18" y="83" class="small">진행 상태 TTL</text></g>
  <path d="M1095 572H1135" class="arrow"/>
  <g transform="translate(1135 520)"><rect width="300" height="105" class="compute"/><text x="18" y="31" class="node-title">Worker · 분석 실행</text><text x="18" y="58" class="node-text">추출·규칙·RAG·OpenAI·PDF</text><text x="18" y="83" class="status" fill="#9a3412">결과를 PostgreSQL에 저장</text></g>

  <text x="120" y="660" class="small">내부 영속 계층</text>
  <g transform="translate(120 675)"><rect width="245" height="42" class="data"/><text x="18" y="27" class="node-text">PostgreSQL · 분석 결과</text></g>
  <g transform="translate(390 675)"><rect width="235" height="42" class="data"/><text x="18" y="27" class="node-text">ChromaDB · 공개 근거</text></g>
  <g transform="translate(650 675)"><rect width="300" height="42" class="data"/><text x="18" y="27" class="node-text">암호화 원문 · PDF 볼륨</text></g>
  <g transform="translate(975 675)"><rect width="245" height="42" class="compute"/><text x="18" y="27" class="node-text">Retention · TTL 삭제</text></g>
  <g transform="translate(1245 675)"><rect width="190" height="42" class="compute"/><text x="18" y="27" class="node-text">Migration · Corpus Init</text></g>

  <path d="M585 295V470H480V520" class="arrow"/>
  <path d="M1530 295V430H1330V445" class="dashed"/>

  <g transform="translate(1550 500)">
    <rect width="270" height="180" class="external"/>
    <text x="20" y="32" class="node-title" fill="#991b1b">OpenAI Responses API</text>
    <text x="20" y="62" class="node-text">gpt-5.6-luna</text>
    <text x="20" y="89" class="node-text">구조화 요약 · 문맥 후보</text>
    <text x="20" y="118" class="small">마스킹된 최소 텍스트</text>
    <text x="20" y="142" class="small">store: false</text>
    <text x="20" y="165" class="status" fill="#991b1b">실제 API 검증 완료</text>
  </g>
  <path d="M1435 572H1550" class="dashed"/>

  <!-- RAG -->
  <rect x="50" y="815" width="1820" height="315" class="lane" filter="url(#shadow)"/>
  <text x="80" y="855" class="lane-title">3. RAG 근거 검색 파트</text>
  <text x="80" y="881" class="small">Worker 내부의 검색 로직입니다. 규칙이 탐지한 마스킹 조항에 연결할 공개 법률 근거를 찾으며 사용자 계약서는 검색 코퍼스에 저장하지 않습니다.</text>

  <g transform="translate(80 915)"><rect width="235" height="105" class="rag"/><text x="18" y="31" class="node-title">① 마스킹 조항</text><text x="18" y="59" class="node-text">규칙 위험 신호의 문맥</text><text x="18" y="84" class="status" fill="#166534">검색 질의</text></g>
  <path d="M315 967H355" class="green-arrow"/>
  <g transform="translate(355 915)"><rect width="270" height="105" class="rag"/><text x="18" y="31" class="node-title">② Chroma 벡터 후보</text><text x="18" y="59" class="node-text">local hashing · 5개 컬렉션</text><text x="18" y="84" class="status" fill="#166534">후보 풀 확장</text></g>
  <path d="M625 967H665" class="green-arrow"/>
  <g transform="translate(665 915)"><rect width="280" height="105" class="rag"/><text x="18" y="31" class="node-title">③ Hybrid 재정렬</text><text x="18" y="59" class="node-text">벡터 45% + BM25 40%</text><text x="18" y="84" class="status" fill="#166534">출처 권위 15%</text></g>
  <path d="M945 967H985" class="green-arrow"/>
  <g transform="translate(985 915)"><rect width="280" height="105" class="rag"/><text x="18" y="31" class="node-title">④ 상위 근거 3개</text><text x="18" y="59" class="node-text">evidence ID · 출처 URL</text><text x="18" y="84" class="status" fill="#166534">분석·인용 검증에 전달</text></g>

  <g transform="translate(1305 900)">
    <rect width="515" height="135" class="actor"/>
    <text x="20" y="31" class="node-title">RAG와 별도: 오프라인 다국어 E5</text>
    <text x="20" y="59" class="node-text">intfloat/multilingual-e5-small · EC2 로컬 모델</text>
    <text x="20" y="86" class="node-text">규칙이 놓칠 수 있는 위험 범주 후보를 의미 유사도로 탐색</text>
    <text x="20" y="112" class="status" fill="#6d28d9">법률 근거 검색이 아니라 검토 후보 생성</text>
  </g>

  <g transform="translate(355 1045)"><rect width="590" height="58" class="data"/><text x="18" y="24" class="node-title">ChromaDB 공개 법률 코퍼스</text><text x="18" y="46" class="small">법령 · 공정위 심결 · 판례 · 분쟁조정 · 조항 패턴 / 현재 검증 코퍼스: 약관법 7개 조문</text></g>
  <path d="M490 1045V1020" class="green-arrow"/>
  <g transform="translate(80 1045)"><rect width="235" height="58" class="rag"/><text x="18" y="24" class="node-title">Corpus Pipeline</text><text x="18" y="46" class="small">출처·권리·hash 검증</text></g>
  <path d="M315 1074H355" class="green-arrow"/>

  <!-- End-to-end -->
  <rect x="50" y="1155" width="1820" height="180" class="lane" filter="url(#shadow)"/>
  <text x="80" y="1195" class="lane-title">4. 사용자 요청의 전체 처리 순서</text>

  <g transform="translate(80 1220)"><rect width="260" height="75" class="rag"/><text x="18" y="29" class="node-title">업로드·추출·마스킹</text><text x="18" y="55" class="small">PDF · DOCX · TXT · OCR</text></g>
  <path d="M340 1258H385" class="arrow"/>
  <g transform="translate(385 1220)"><rect width="230" height="75" class="rag"/><text x="18" y="29" class="node-title">19개 규칙 탐지</text><text x="18" y="55" class="small">결정적 위험 신호</text></g>
  <path d="M615 1258H660" class="arrow"/>
  <g transform="translate(660 1220)"><rect width="250" height="75" class="rag"/><text x="18" y="29" class="node-title">RAG 근거 연결</text><text x="18" y="55" class="small">공개 출처 상위 3개</text></g>
  <path d="M910 1258H955" class="arrow"/>
  <g transform="translate(955 1220)"><rect width="260" height="75" class="rag"/><text x="18" y="29" class="node-title">E5·OpenAI 보강</text><text x="18" y="55" class="small">후보 · 설명 · 검토 질문</text></g>
  <path d="M1215 1258H1260" class="arrow"/>
  <g transform="translate(1260 1220)"><rect width="250" height="75" class="rag"/><text x="18" y="29" class="node-title">근거·인용 검증</text><text x="18" y="55" class="small">실패 시 needs_review</text></g>
  <path d="M1510 1258H1555" class="arrow"/>
  <g transform="translate(1555 1220)"><rect width="265" height="75" class="rag"/><text x="18" y="29" class="node-title">결과·PDF·사람 검토</text><text x="18" y="55" class="small">최종 판단은 사용자</text></g>

  <!-- Verification -->
  <rect x="50" y="1360" width="1820" height="95" class="lane" filter="url(#shadow)"/>
  <g transform="translate(75 1377)"><rect width="550" height="60" class="rag"/><text x="18" y="25" class="node-title">검증</text><text x="18" y="47" class="small">Backend 131 · Frontend 10 + build · ngrok/OpenAI/PDF E2E 통과</text></g>
  <g transform="translate(655 1377)"><rect width="570" height="60" class="compute"/><text x="18" y="25" class="node-title">코드 배포</text><text x="18" y="47" class="small">push → git pull --ff-only → compose up -d --build · ngrok 유지</text></g>
  <g transform="translate(1255 1377)"><rect width="540" height="60" class="data"/><text x="18" y="25" class="node-title">데이터</text><text x="18" y="47" class="small">named volume 유지 · down -v 및 prune --volumes 금지</text></g>

  <text x="70" y="1483" class="tiny">실선: 사용자·분석 주 흐름 · 점선: 관리·외부 API 경계 · 분석 결과는 위험 신호이며 법률적 최종 판단은 사람의 검토 대상</text>
</svg>
