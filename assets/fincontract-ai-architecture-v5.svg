    <text x="20" y="61" class="node-text">계약서 업로드 · 진행 상태 확인</text>
    <text x="20" y="86" class="node-text">마스킹 뷰어 · 결과 · PDF 리포트</text>
    <text x="20" y="110" class="status" fill="#6d28d9">HTTPS 동일 출처 /api/v1</text>
  </g>
