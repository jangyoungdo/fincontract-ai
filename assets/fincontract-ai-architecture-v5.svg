    <text x="20" y="86" class="node-text">EC2 git pull --ff-only</text>
    <text x="20" y="110" class="status" fill="#0e7490">소스·문서 버전 기준</text>
  </g>
  <path d="M1160 290H1495" class="dashed"/>
  <g transform="translate(1495 190)">
    <rect width="290" height="125" class="edge"/>
    <text x="20" y="32" class="node-title">AWS SSM Session Manager</text>
    <text x="20" y="61" class="node-text">Mac 네트워크 변경과 무관</text>
    <text x="20" y="86" class="node-text">인바운드 SSH 22 불필요</text>
    <text x="20" y="110" class="status" fill="#0e7490">EC2 관리 채널</text>
  </g>

  <!-- EC2 and Docker -->
