    <text x="20" y="86" class="node-text">aws login → SSM 기반 SSH</text>
    <text x="20" y="110" class="status" fill="#6d28d9">ssh fincontract-prod</text>
  </g>
  <path d="M1160 225H1205" class="arrow"/>
  <g transform="translate(1205 190)">
