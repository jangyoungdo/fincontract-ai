    <text x="18" y="84" class="small">upload-data · report-data</text>
    <text x="18" y="108" class="status" fill="#1d4ed8">TTL 삭제</text>
  </g>
  <g transform="translate(1245 735)">
    <rect width="255" height="125" class="data"/>
    <text x="18" y="31" class="node-title">Caddy 데이터</text>
    <text x="18" y="59" class="node-text">gateway 설정·상태</text>
    <text x="18" y="84" class="small">caddy-data · config</text>
    <text x="18" y="108" class="status" fill="#1d4ed8">named volume</text>
  </g>

  <path d="M570 315V555" class="arrow-blue"/>
