    <text x="18" y="108" class="status" fill="#1d4ed8">named volume</text>
  </g>
  <g transform="translate(405 735)">
    <rect width="215" height="125" class="data"/>
    <text x="18" y="31" class="node-title">Redis 8</text>
    <text x="18" y="59" class="node-text">작업 큐 · 진행률 TTL</text>
    <text x="18" y="84" class="small">원문 저장 금지</text>
    <text x="18" y="108" class="status" fill="#1d4ed8">내부 전용</text>
  </g>
  <g transform="translate(655 735)">
    <rect width="245" height="125" class="data"/>
    <text x="18" y="31" class="node-title">ChromaDB</text>
    <text x="18" y="59" class="node-text">검증된 공개 법률 코퍼스</text>
