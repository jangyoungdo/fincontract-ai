  <!-- Processing flow -->
  <rect x="50" y="980" width="1820" height="270" class="lane" filter="url(#shadow)"/>
  <text x="80" y="1020" class="lane-title">3. 계약서 분석 처리 흐름</text>
  <text x="80" y="1047" class="small">원문은 EC2 내부에서 추출·마스킹되며, 외부 모델은 규칙 결과를 대체하지 않고 검토 설명과 후보만 보강합니다.</text>

  <g transform="translate(75 1080)"><rect width="220" height="120" class="verified"/><text x="16" y="30" class="node-title">① 파일 검증·추출</text><text x="16" y="59" class="node-text">PDF · DOCX · TXT</text><text x="16" y="84" class="small">PDFium · Tesseract OCR</text><text x="16" y="106" class="status" fill="#166534">검증 완료</text></g>
  <path d="M295 1140H325" class="arrow"/>
  <g transform="translate(325 1080)"><rect width="220" height="120" class="verified"/><text x="16" y="30" class="node-title">② PII 마스킹</text><text x="16" y="59" class="node-text">연락처 · 신분 · 금융정보</text><text x="16" y="84" class="small">잔존 패턴 재검증</text><text x="16" y="106" class="status" fill="#166534">안전 경계</text></g>
  <path d="M545 1140H575" class="arrow"/>
  <g transform="translate(575 1080)"><rect width="220" height="120" class="verified"/><text x="16" y="30" class="node-title">③ 조항·규칙 엔진</text><text x="16" y="59" class="node-text">분리 · 위치 · 위험 신호</text><text x="16" y="84" class="small">확정 판단 아님</text><text x="16" y="106" class="status" fill="#166534">결정적 기준선</text></g>
  <path d="M795 1140H825" class="arrow"/>
  <g transform="translate(825 1080)"><rect width="220" height="120" class="verified"/><text x="16" y="30" class="node-title">④ Hybrid RAG</text><text x="16" y="59" class="node-text">벡터 후보 + BM25</text><text x="16" y="84" class="small">공개 근거 검색</text><text x="16" y="106" class="status" fill="#166534">출처 추적</text></g>
  <path d="M1045 1140H1075" class="arrow"/>
  <g transform="translate(1075 1080)"><rect width="220" height="120" class="verified"/><text x="16" y="30" class="node-title">⑤ OpenAI 보강</text><text x="16" y="59" class="node-text">구조화 설명 · 후보</text><text x="16" y="84" class="small">호출 한도 · 비저장</text><text x="16" y="106" class="status" fill="#166534">실연결 완료</text></g>
  <path d="M1295 1140H1325" class="arrow"/>
  <g transform="translate(1325 1080)"><rect width="220" height="120" class="verified"/><text x="16" y="30" class="node-title">⑥ 인용·근거 검증</text><text x="16" y="59" class="node-text">evidence ID 확인</text><text x="16" y="84" class="small">실패 → needs_review</text><text x="16" y="106" class="status" fill="#166534">fail-closed</text></g>
  <path d="M1545 1140H1575" class="arrow"/>
  <g transform="translate(1575 1080)"><rect width="270" height="120" class="verified"/><text x="16" y="30" class="node-title">⑦ 결과·사람 검토</text><text x="16" y="59" class="node-text">JSON · 마스킹 뷰 · PDF</text><text x="16" y="84" class="small">최종 판단은 사용자</text><text x="16" y="106" class="status" fill="#166534">E2E 완료</text></g>

  <!-- Verification and operations -->
  <rect x="50" y="1275" width="1820" height="205" class="lane" filter="url(#shadow)"/>
  <text x="80" y="1315" class="lane-title">4. 배포 검증과 반복 운영</text>

  <g transform="translate(80 1340)">
    <rect width="560" height="105" class="verified"/>
    <text x="20" y="31" class="node-title">검증 결과</text>
    <text x="20" y="59" class="node-text">Backend 131 tests · Frontend 10 tests + production build</text>
    <text x="20" y="84" class="small">ngrok HTTPS 업로드 → OpenAI 분석 → PDF → 삭제 통과</text>
  </g>
  <g transform="translate(675 1340)">
    <rect width="560" height="105" class="compute"/>
    <text x="20" y="31" class="node-title">코드 변경 배포</text>
    <text x="20" y="59" class="node-text">Mac push → EC2 git pull --ff-only → compose up -d --build</text>
    <text x="20" y="84" class="small">ngrok 재시작 불필요 · Frontend 복구 후 같은 URL 사용</text>
  </g>
  <g transform="translate(1270 1340)">
    <rect width="550" height="105" class="data"/>
    <text x="20" y="31" class="node-title">운영 확인</text>
