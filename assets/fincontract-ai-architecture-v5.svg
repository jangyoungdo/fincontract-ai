    <rect width="245" height="118" class="compute"/>
    <text x="18" y="31" class="node-title">FastAPI Backend</text>
    <text x="18" y="59" class="node-text">upload · analysis · report</text>
    <text x="18" y="84" class="small">검증 · 암호화 · 작업 생성</text>
    <text x="18" y="105" class="status" fill="#9a3412">healthy · 127.0.0.1:8000</text>
  </g>
  <path d="M920 614H965" class="arrow"/>
  <g transform="translate(965 555)">
    <rect width="245" height="118" class="compute"/>
    <text x="18" y="31" class="node-title">Redis Worker</text>
    <text x="18" y="59" class="node-text">analysis ID 비동기 처리</text>
    <text x="18" y="84" class="small">추출 · RAG · OpenAI · PDF</text>
    <text x="18" y="105" class="status" fill="#9a3412">큐 소비 · 진행률 기록</text>
  </g>
  <g transform="translate(1255 555)">
    <rect width="245" height="118" class="compute"/>
