  <text x="80" y="425" class="lane-title">2. AWS 서울 리전 · EC2 m7i-flex.large · Ubuntu 26.04 LTS</text>
  <text x="80" y="451" class="small">2 vCPU · 8 GiB RAM · 40 GiB gp3 · 2 GiB Swap · Elastic IP · Docker Engine 29.7.2 / Compose 5.5.0</text>

  <rect x="75" y="475" width="1480" height="445" class="host"/>
  <text x="100" y="507" class="section-label">EC2 호스트 내부 · Docker Compose 네트워크</text>
  <rect x="95" y="525" width="1440" height="370" class="docker"/>

  <g transform="translate(120 555)">
    <rect width="220" height="118" class="compute"/>
    <text x="18" y="31" class="node-title">Caddy Gateway</text>
    <text x="18" y="59" class="node-text">Elastic IP :80 · 도메인 후 :443</text>
    <text x="18" y="84" class="small">Frontend reverse proxy</text>
    <text x="18" y="105" class="status" fill="#9a3412">직접 HTTP 진입</text>
  </g>
  <path d="M340 614H385" class="arrow"/>
  <g transform="translate(385 555)">
    <rect width="245" height="118" class="compute"/>
    <text x="18" y="31" class="node-title">Next.js Frontend</text>
    <text x="18" y="59" class="node-text">App Router · TypeScript</text>
    <text x="18" y="84" class="small">/api/v1 → Backend proxy</text>
    <text x="18" y="105" class="status" fill="#9a3412">127.0.0.1:3000</text>
  </g>
