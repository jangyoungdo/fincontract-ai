<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1540" viewBox="0 0 1920 1540" role="img" aria-labelledby="title desc">
  <title id="title">FinContract AI EC2 운영 실험 아키텍처</title>
  <desc id="desc">사용자와 개발자 인터랙션, ngrok과 SSM 경계, Ubuntu EC2 내부 Docker Compose 서비스, OpenAI 분석, 데이터 저장소 및 배포 검증 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#15803d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .bg{fill:#f8fafc}.title{font:700 42px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#0f172a}.subtitle{font:400 20px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#475569}
      .lane-title{font:700 22px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#0f172a}.section-label{font:700 16px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#475569}
      .node-title{font:700 18px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#0f172a}.node-text{font:400 14px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#334155}.small{font:400 13px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#475569}.tiny{font:400 12px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#64748b}.status{font:700 13px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
      .lane{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:20}.actor{fill:#faf5ff;stroke:#8b5cf6;stroke-width:2;rx:14}.edge{fill:#ecfeff;stroke:#06b6d4;stroke-width:2;rx:14}.compute{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14}.data{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:14}.verified{fill:#f0fdf4;stroke:#22c55e;stroke-width:2;rx:14}.external{fill:#fef2f2;stroke:#ef4444;stroke-width:2;stroke-dasharray:8 6;rx:14}.host{fill:#f8fafc;stroke:#2563eb;stroke-width:2.5;rx:18}.docker{fill:#fff;stroke:#f97316;stroke-width:2;stroke-dasharray:9 6;rx:16}
      .arrow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.arrow-blue{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrow-blue)}.arrow-green{fill:none;stroke:#15803d;stroke-width:2.5;marker-end:url(#arrow-green)}.dashed{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="bg" width="1920" height="1540"/>
  <text x="70" y="65" class="title">FinContract AI EC2 운영 실험 아키텍처</text>
  <text x="70" y="99" class="subtitle">사용자 인터랙션 · Docker Compose · OpenAI Responses API · 2026-09-02 검증 기준</text>

  <g transform="translate(1310 45)">
    <rect width="130" height="38" class="actor"/><circle cx="18" cy="19" r="6" fill="#8b5cf6"/><text x="32" y="25" class="status" fill="#6d28d9">외부 사용자</text>
    <rect x="145" width="130" height="38" class="edge"/><circle cx="163" cy="19" r="6" fill="#06b6d4"/><text x="177" y="25" class="status" fill="#0e7490">접속 경계</text>
    <rect x="290" width="130" height="38" class="compute"/><circle cx="308" cy="19" r="6" fill="#f97316"/><text x="322" y="25" class="status" fill="#9a3412">실행 서비스</text>
    <rect x="435" width="130" height="38" class="data"/><circle cx="453" cy="19" r="6" fill="#3b82f6"/><text x="467" y="25" class="status" fill="#1d4ed8">영속 데이터</text>
  </g>

  <!-- External interaction -->
  <rect x="50" y="125" width="1820" height="230" class="lane" filter="url(#shadow)"/>
  <text x="80" y="164" class="lane-title">1. 사용자 · 개발자 인터랙션과 공개 진입점</text>

  <g transform="translate(85 190)">
