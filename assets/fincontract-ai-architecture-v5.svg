    <text x="20" y="84" class="small">볼륨 삭제 금지 · 은행 상품 실데이터·정식 운영 보강은 별도</text>
  </g>

  <text x="70" y="1515" class="tiny">굵은 실선: 사용자·분석 흐름 · 점선: 배포·관리·외부 API 경계 · 모든 결과는 위험 신호이며 법률적 최종 판단은 사람의 검토 대상</text>
</svg>
