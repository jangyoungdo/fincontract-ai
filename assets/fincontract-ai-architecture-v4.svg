<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1380" viewBox="0 0 1920 1380" role="img" aria-labelledby="title desc">
  <title id="title">FinContract AI 구현 상세 아키텍처</title>
  <desc id="desc">계약서 업로드부터 안전한 추출, 개인정보 마스킹, 규칙과 RAG 검색, 구조화 분석, 인용 검증, 리포트와 사람 검토까지의 현재 구현 및 남은 과제를 보여주는 도식</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .bg { fill:#f8fafc; }
      .title { font:700 42px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif; fill:#0f172a; }
      .subtitle { font:400 20px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif; fill:#475569; }
      .lane-title { font:700 22px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif; fill:#0f172a; }
      .node-title { font:700 19px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif; fill:#0f172a; }
      .node-text { font:400 15px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif; fill:#334155; }
      .small { font:400 13px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif; fill:#475569; }
      .tiny { font:400 12px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif; fill:#64748b; }
      .status { font:700 13px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
      .lane { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:20; }
      .verified { fill:#f0fdf4; stroke:#22c55e; stroke-width:2; rx:14; }
      .partial { fill:#fffbeb; stroke:#f59e0b; stroke-width:2; rx:14; }
      .planned { fill:#f8fafc; stroke:#94a3b8; stroke-width:2; stroke-dasharray:8 6; rx:14; }
      .safety { fill:#fff7ed; stroke:#f97316; stroke-width:2; rx:14; }
      .data { fill:#eff6ff; stroke:#3b82f6; stroke-width:2; rx:14; }
      .external { fill:#fef2f2; stroke:#ef4444; stroke-width:2; stroke-dasharray:8 6; rx:14; }
      .arrow { fill:none; stroke:#334155; stroke-width:2.5; marker-end:url(#arrow); }
      .arrow-green { fill:none; stroke:#15803d; stroke-width:2.5; marker-end:url(#arrow-green); }
      .dashed { fill:none; stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1920" height="1380"/>

  <text x="70" y="68" class="title">FinContract AI 구현 상세 아키텍처</text>
  <text x="70" y="102" class="subtitle">현재 코드와 실행 검증 기준 · 2026-08-31</text>

  <g transform="translate(1090 48)">
    <rect x="0" y="0" width="145" height="40" class="verified"/>
    <circle cx="20" cy="20" r="7" fill="#22c55e"/><text x="36" y="26" class="status" fill="#166534">구현·검증</text>
    <rect x="160" y="0" width="145" height="40" class="partial"/>
    <circle cx="180" cy="20" r="7" fill="#f59e0b"/><text x="196" y="26" class="status" fill="#92400e">부분·외부 필요</text>
    <rect x="320" y="0" width="145" height="40" class="planned"/>
    <circle cx="340" cy="20" r="7" fill="#94a3b8"/><text x="356" y="26" class="status" fill="#475569">미구현·대기</text>
    <rect x="480" y="0" width="145" height="40" class="data"/>
    <circle cx="500" cy="20" r="7" fill="#3b82f6"/><text x="516" y="26" class="status" fill="#1d4ed8">데이터 저장</text>
  </g>

  <!-- User-facing experience -->
  <rect x="50" y="135" width="1820" height="205" class="lane" filter="url(#shadow)"/>
  <text x="80" y="174" class="lane-title">1. 사용자 화면 · Next.js</text>

  <g transform="translate(90 195)">
    <rect width="300" height="112" class="verified"/>
    <text x="20" y="32" class="node-title">계약서 업로드</text>
    <text x="20" y="59" class="node-text">PDF · DOCX · TXT</text>
    <text x="20" y="84" class="small">크기·형식 오류 즉시 표시</text>
    <text x="242" y="28" class="status" fill="#166534">완료</text>
  </g>
  <g transform="translate(445 195)">
    <rect width="300" height="112" class="verified"/>
    <text x="20" y="32" class="node-title">분석 진행 상태</text>
    <text x="20" y="59" class="node-text">queued → completed / failed</text>
    <text x="20" y="84" class="small">Redis worker 진행률 또는 동기 처리</text>
    <text x="242" y="28" class="status" fill="#166534">완료</text>
  </g>
  <g transform="translate(800 195)">
    <rect width="300" height="112" class="verified"/>
    <text x="20" y="32" class="node-title">마스킹 원문 뷰어</text>
    <text x="20" y="59" class="node-text">전체 문서 · 위험 조항 하이라이트</text>
    <text x="20" y="84" class="small">마스킹 전 원문은 화면에 미제공</text>
    <text x="242" y="28" class="status" fill="#166534">완료</text>
  </g>
  <g transform="translate(1155 195)">
    <rect width="300" height="112" class="verified"/>
    <text x="20" y="32" class="node-title">분석 결과 · 리포트</text>
    <text x="20" y="59" class="node-text">근거 · 반대사정 · 검토질문</text>
    <text x="20" y="84" class="small">JSON 조회 · PDF 다운로드</text>
    <text x="242" y="28" class="status" fill="#166534">완료</text>
  </g>
  <g transform="translate(1510 195)">
    <rect width="300" height="112" class="partial"/>
    <text x="20" y="32" class="node-title">은행 상품 비교</text>
    <text x="20" y="59" class="node-text">출처 검증 없으면 fail-closed</text>
    <text x="20" y="84" class="small">실제 비교 데이터 확보 필요</text>
    <text x="242" y="28" class="status" fill="#92400e">부분</text>
  </g>

  <!-- Main processing pipeline -->
  <rect x="50" y="365" width="1820" height="410" class="lane" filter="url(#shadow)"/>
  <text x="80" y="405" class="lane-title">2. 분석 파이프라인 · FastAPI / Python 3.12</text>
  <text x="80" y="432" class="small">원문은 로컬 안전 경계를 벗어나기 전에 반드시 마스킹됩니다.</text>

  <g transform="translate(75 485)">
    <rect width="220" height="150" class="verified"/>
    <text x="18" y="32" class="node-title">① 파일 게이트·추출</text>
    <text x="18" y="62" class="node-text">서명·확장자·크기 검증</text>
    <text x="18" y="87" class="node-text">PDF / DOCX 표 / TXT</text>
    <text x="18" y="114" class="small">스캔 PDF → OCR_REQUIRED</text>
    <text x="18" y="136" class="status" fill="#166534">검증 완료</text>
  </g>
  <path d="M295 560 H330" class="arrow"/>
  <g transform="translate(330 485)">
    <rect width="220" height="150" class="verified"/>
    <text x="18" y="32" class="node-title">② PII 마스킹</text>
    <text x="18" y="62" class="node-text">연락처 · 신분 · 금융정보</text>
    <text x="18" y="87" class="node-text">이름·주소 문맥 탐지</text>
    <text x="18" y="114" class="small">잔존 패턴 검증 후 진행</text>
    <text x="18" y="136" class="status" fill="#166534">6-case 회귀 통과</text>
  </g>
  <path d="M550 560 H585" class="arrow"/>
  <g transform="translate(585 485)">
    <rect width="220" height="150" class="verified"/>
    <text x="18" y="32" class="node-title">③ 분리·규칙 엔진</text>
    <text x="18" y="62" class="node-text">문단·DOCX 표 조항 분리</text>
    <text x="18" y="87" class="node-text">8개 위험 신호 규칙</text>
    <text x="18" y="114" class="small">위법 확정이 아닌 검토 신호</text>
    <text x="18" y="136" class="status" fill="#166534">단위 검증 완료</text>
  </g>
  <path d="M805 560 H840" class="arrow"/>
  <g transform="translate(840 485)">
    <rect width="220" height="150" class="verified"/>
    <text x="18" y="32" class="node-title">④ Hybrid RAG</text>
    <text x="18" y="62" class="node-text">벡터 후보 + BM25 재정렬</text>
    <text x="18" y="87" class="node-text">출처 권위 점수 결합</text>
    <text x="18" y="114" class="small">마스킹 조항만 검색</text>
    <text x="18" y="136" class="status" fill="#166534">Hit@3 / MRR 1.0</text>
  </g>
  <path d="M1060 560 H1095" class="arrow"/>
  <g transform="translate(1095 485)">
    <rect width="220" height="150" class="partial"/>
    <text x="18" y="32" class="node-title">⑤ 구조화 분석</text>
    <text x="18" y="62" class="node-text">위험 · 반대사정 · 질문</text>
    <text x="18" y="87" class="node-text">근거 ID만 인용</text>
    <text x="18" y="114" class="small">fake provider E2E 완료</text>
    <text x="18" y="136" class="status" fill="#92400e">Claude 실연결 대기</text>
  </g>
  <path d="M1315 560 H1350" class="arrow"/>
  <g transform="translate(1350 485)">
    <rect width="220" height="150" class="verified"/>
    <text x="18" y="32" class="node-title">⑥ 인용·근거 검증</text>
    <text x="18" y="62" class="node-text">evidence ID 존재 확인</text>
    <text x="18" y="87" class="node-text">근거 없는 참조 차단</text>
    <text x="18" y="114" class="small">실패 → needs_review</text>
    <text x="18" y="136" class="status" fill="#166534">안전 종료 완료</text>
  </g>
  <path d="M1570 560 H1605" class="arrow"/>
  <g transform="translate(1605 485)">
    <rect width="220" height="150" class="verified"/>
    <text x="18" y="32" class="node-title">⑦ 저장·리포트</text>
    <text x="18" y="62" class="node-text">분석 결과 · PDF</text>
    <text x="18" y="87" class="node-text">감사 이벤트 기록</text>
    <text x="18" y="114" class="small">사람의 최종 검토</text>
    <text x="18" y="136" class="status" fill="#166534">브라우저 E2E 완료</text>
  </g>

  <g transform="translate(1065 660)">
    <rect width="280" height="82" class="external"/>
    <text x="18" y="29" class="node-title" fill="#991b1b">외부 Claude API 경계</text>
    <text x="18" y="54" class="small">기본 비활성 · 명시적 opt-in</text>
    <text x="18" y="73" class="tiny">마스킹된 최소 텍스트 + 근거만 전송</text>
  </g>
  <path d="M1205 660 V640" class="dashed"/>
  <g transform="translate(1365 668)">
    <rect width="420" height="66" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" rx="12"/>
    <text x="18" y="27" class="node-text">안전 규칙: 검색·LLM 장애 시 근거를 만들지 않음</text>
    <text x="18" y="50" class="status" fill="#9a3412">결과 상태를 needs_review로 유지</text>
  </g>

  <!-- Data, RAG, operations -->
  <rect x="50" y="800" width="1820" height="330" class="lane" filter="url(#shadow)"/>
  <text x="80" y="840" class="lane-title">3. 데이터 · RAG · 운영 경계</text>

  <g transform="translate(80 875)">
    <rect width="280" height="185" class="data"/>
    <text x="20" y="34" class="node-title">암호화 원문 저장소</text>
    <text x="20" y="65" class="node-text">Fernet 암호화 파일</text>
    <text x="20" y="91" class="node-text">문서 TTL 기본 24시간</text>
    <text x="20" y="117" class="node-text">만료 시 tombstone + 감사</text>
    <text x="20" y="151" class="small">평문 부재 round-trip 검증</text>
    <text x="20" y="174" class="status" fill="#166534">구현·검증</text>
  </g>
  <path d="M185 635 V875" class="dashed"/>

  <g transform="translate(390 875)">
    <rect width="280" height="185" class="data"/>
    <text x="20" y="34" class="node-title">PostgreSQL / SQLite</text>
    <text x="20" y="65" class="node-text">문서 메타데이터</text>
    <text x="20" y="91" class="node-text">분석 상태·결과·버전</text>
    <text x="20" y="117" class="node-text">감사 로그 365일 정책</text>
    <text x="20" y="151" class="small">migration 멱등성 검증</text>
    <text x="20" y="174" class="status" fill="#166534">구현·검증</text>
  </g>
  <path d="M1715 635 V810 H530 V875" class="dashed"/>

  <g transform="translate(700 875)">
    <rect width="280" height="185" class="data"/>
    <text x="20" y="34" class="node-title">Redis + Worker</text>
    <text x="20" y="65" class="node-text">큐에는 analysis ID만 저장</text>
    <text x="20" y="91" class="node-text">진행률 TTL 1시간</text>
    <text x="20" y="117" class="node-text">재시도 2회 → DLQ</text>
    <text x="20" y="151" class="small">실제 Redis 장애 주입 통과</text>
    <text x="20" y="174" class="status" fill="#166534">구현·검증</text>
  </g>
  <path d="M745 635 V875" class="dashed"/>

  <g transform="translate(1010 875)">
    <rect width="500" height="185" class="verified"/>
    <text x="20" y="34" class="node-title">ChromaDB 공개 법률 코퍼스</text>
    <text x="20" y="65" class="node-text">법령 · 공정위 심결 · 판례 · 분쟁 · 조항 패턴</text>
    <text x="20" y="94" class="small">현재 verified: 국가법령정보센터 약관법 7개 조문</text>
    <text x="20" y="119" class="small">manifest: 출처 · 라이선스 근거 URL · 본문/코퍼스 SHA-256</text>
    <text x="20" y="144" class="small">local hashing 또는 로컬 all-MiniLM-L6-v2</text>
    <text x="20" y="170" class="status" fill="#166534">멱등 적재·provider 차원 격리 검증</text>
  </g>
  <path d="M950 635 V875" class="arrow-green"/>

  <g transform="translate(1540 875)">
    <rect width="280" height="185" class="verified"/>
    <text x="20" y="34" class="node-title">Corpus Pipeline</text>
    <text x="20" y="65" class="node-text">출처·권리 검증</text>
    <text x="20" y="91" class="node-text">중복 제거·stable ID</text>
    <text x="20" y="117" class="node-text">hash·버전·평가 분리</text>
    <text x="20" y="151" class="small">불명확한 자료는 적재 차단</text>
    <text x="20" y="174" class="status" fill="#166534">게이트 구현</text>
  </g>
  <path d="M1540 967 H1510" class="arrow-green"/>

  <!-- Verification summary and gaps -->
  <rect x="50" y="1155" width="1820" height="175" class="lane" filter="url(#shadow)"/>
  <text x="80" y="1195" class="lane-title">4. 현재 검증 결과와 다음 외부 과제</text>

  <g transform="translate(80 1220)">
    <rect width="740" height="82" class="verified"/>
    <text x="20" y="30" class="node-title">완료된 실행 검증</text>
    <text x="20" y="56" class="node-text">Backend 53 tests · Frontend 4 tests + build · PDF browser E2E</text>
    <text x="20" y="76" class="small">Redis retry/DLQ · 공개 법령 RAG · MiniLM/해시 검색 · PDF report</text>
  </g>

  <g transform="translate(850 1220)">
    <rect width="970" height="82" class="planned"/>
    <text x="20" y="30" class="node-title">아직 남은 영역</text>
    <text x="20" y="56" class="node-text">실제 OCR · Claude 운영 키 · Docker Compose · 네트워크 복구 · KMS 키 회전</text>
    <text x="20" y="76" class="small">심결/판례/분쟁/표준약관 확대 · 블라인드 전문가 평가 · 관리자 감사 UI</text>
  </g>

  <text x="70" y="1360" class="tiny">굵은 실선: 주 처리 흐름 · 점선: 운영/외부 의존 연결 · 모든 법률 결과는 위험 신호이며 최종 판단은 사람의 검토 대상</text>
</svg>
