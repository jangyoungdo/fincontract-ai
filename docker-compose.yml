services:
  # Stateful infrastructure is kept on named volumes so source checkouts never
  # contain database rows, vector indexes, or encrypted customer documents.
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: fincontract
      POSTGRES_USER: fincontract
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincontract -d fincontract"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      # The upstream Chroma image does not ship curl. Use Bash's TCP support
      # to verify the heartbeat endpoint itself instead of checking only that
      # the server process or port exists.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Run schema setup as a one-shot gate. API, worker, and retention services do
  # not start until the database is ready and this idempotent migration passes.
  migrate:
    build: ./backend
    command: ["python", "scripts/migrate.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://fincontract:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/fincontract
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  # Seed only the reviewed public corpus. The read-only bind mount prevents an
  # initializer bug from changing provenance manifests or source records.
  corpus-init:
    build: ./backend
    command: ["python", "scripts/ingest_corpus.py", "/research/public_manifest_v0_1.json", "/research/public_corpus/statutes.jsonl", "--schema", "/research/manifest.schema.json"]
    environment:
      CHROMA_MODE: http
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      EMBEDDING_PROVIDER: local_hashing
    depends_on:
      chroma: {condition: service_healthy}
    volumes:
      - ./research:/research:ro
    restart: "no"

  # Browser-facing API contains no plaintext bind mounts; uploaded bytes and
  # reports stay inside encrypted/application-managed named volumes.
  backend:
    build: ./backend
    # A stable local tag lets reproducibility tools inspect the newly built
    # image even while an older backend container is still being replaced.
    image: fincontract-ai-backend:local
    environment:
      APP_ENV: development
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql+psycopg://fincontract:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/fincontract
      CHROMA_MODE: http
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      EMBEDDING_PROVIDER: local_hashing
      USE_REDIS: "true"
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ALLOW_EXTERNAL_LLM: ${ALLOW_EXTERNAL_LLM:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_FAST_MODEL: ${OPENAI_FAST_MODEL:-gpt-5.6-luna}
      OPENAI_BALANCED_MODEL: ${OPENAI_BALANCED_MODEL:-gpt-5.6-luna}
      OPENAI_DEEP_MODEL: ${OPENAI_DEEP_MODEL:-gpt-5.6-terra}
      OPENAI_CONTEXT_REVIEW_ENABLED: ${OPENAI_CONTEXT_REVIEW_ENABLED:-false}
      OPENAI_CONTEXT_MAX_CALLS: ${OPENAI_CONTEXT_MAX_CALLS:-2}
      OPENAI_CONTEXT_MAX_CHARS_PER_CALL: ${OPENAI_CONTEXT_MAX_CHARS_PER_CALL:-12000}
      OPENAI_CONTEXT_MAX_CANDIDATES_PER_SECTION: ${OPENAI_CONTEXT_MAX_CANDIDATES_PER_SECTION:-3}
      OPENAI_SUMMARY_ENABLED: ${OPENAI_SUMMARY_ENABLED:-true}
      SEMANTIC_MODEL_REQUIRED: "true"
      OCR_ENABLED: "true"
      OCR_LANGUAGES: kor+eng
      UPLOAD_DIR: /data/uploads
      REPORT_DIR: /data/reports
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:?set DOCUMENT_ENCRYPTION_KEY}
      ADMIN_AUDIT_TOKEN: ${ADMIN_AUDIT_TOKEN:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
      corpus-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    ports:
      - "8000:8000"
    volumes:
      - upload-data:/data/uploads
      - report-data:/data/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Queue messages contain analysis IDs only. The worker re-reads encrypted
  # documents from the shared volume and never places source text in Redis.
  worker:
    build: ./backend
    command: ["python", "scripts/run_worker.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://fincontract:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/fincontract
      CHROMA_MODE: http
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      EMBEDDING_PROVIDER: local_hashing
      USE_REDIS: "true"
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ALLOW_EXTERNAL_LLM: ${ALLOW_EXTERNAL_LLM:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_FAST_MODEL: ${OPENAI_FAST_MODEL:-gpt-5.6-luna}
      OPENAI_BALANCED_MODEL: ${OPENAI_BALANCED_MODEL:-gpt-5.6-luna}
      OPENAI_DEEP_MODEL: ${OPENAI_DEEP_MODEL:-gpt-5.6-terra}
      OPENAI_CONTEXT_REVIEW_ENABLED: ${OPENAI_CONTEXT_REVIEW_ENABLED:-false}
      OPENAI_CONTEXT_MAX_CALLS: ${OPENAI_CONTEXT_MAX_CALLS:-2}
      OPENAI_CONTEXT_MAX_CHARS_PER_CALL: ${OPENAI_CONTEXT_MAX_CHARS_PER_CALL:-12000}
      OPENAI_CONTEXT_MAX_CANDIDATES_PER_SECTION: ${OPENAI_CONTEXT_MAX_CANDIDATES_PER_SECTION:-3}
      OPENAI_SUMMARY_ENABLED: ${OPENAI_SUMMARY_ENABLED:-true}
      SEMANTIC_MODEL_REQUIRED: "true"
      OCR_ENABLED: "true"
      OCR_LANGUAGES: kor+eng
      UPLOAD_DIR: /data/uploads
      REPORT_DIR: /data/reports
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:?set DOCUMENT_ENCRYPTION_KEY}
    depends_on:
      migrate: {condition: service_completed_successfully}
      corpus-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    volumes:
      - upload-data:/data/uploads
      - report-data:/data/reports
    restart: unless-stopped

  # Retention starts only after migrations and continuously removes expired
  # encrypted files, report files, metadata, and audit events by policy.
  retention:
    build: ./backend
    command: ["python", "scripts/enforce_retention.py", "--loop"]
    environment:
      DATABASE_URL: postgresql+psycopg://fincontract:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/fincontract
      UPLOAD_DIR: /data/uploads
      REPORT_DIR: /data/reports
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:?set DOCUMENT_ENCRYPTION_KEY}
      RETENTION_INTERVAL_SECONDS: "300"
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes:
      - upload-data:/data/uploads
      - report-data:/data/reports
    restart: unless-stopped

  # The production Next.js standalone image starts only after API readiness,
  # which already covers PostgreSQL, Redis, and Chroma connectivity.
  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  chroma-data:
  upload-data:
  report-data:
