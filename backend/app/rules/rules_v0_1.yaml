{
  "ruleset_id": "loan-terms-baseline",
  "version": "0.2.0",
  "status": "experimental_unreviewed",
  "scope": "은행 여신거래기본약관 형태의 합성 한국어 조항",
  "limitations": [
    "법률 전문가 검토 전 실험용 위험 신호이며 위법성 판단이 아니다.",
    "정규식은 문맥, 개별 협상, 강행규정 및 최신 법령을 완전히 판단하지 못한다.",
    "법적 근거 후보의 조문 원문과 시행일은 검증된 research manifest에서 별도로 확인해야 한다."
  ],
  "rules": [
    {
      "id": "R04_UNILATERAL_CHANGE",
      "name": "사업자의 일방적 계약내용 변경",
      "category": "unilateral_change",
      "priority": 2,
      "positive_patterns": [
        "(?:은행|회사|사업자).{0,30}(?:임의로|일방적으로|필요하다고 인정하는 경우).{0,30}(?:변경|조정).{0,10}(?:할 수 있다|한다)",
        "(?:은행|회사|사업자).{0,30}사전 통지 없이.{0,30}(?:변경|조정).{0,10}(?:할 수 있다|한다)",
        "(?:금리|수수료|서비스|계약\u0020?내용).{0,30}(?:사전 통지 없이).{0,20}(?:변경|조정)"
      ],
      "negative_patterns": [
        "고객의 명시적 동의",
        "변경에 동의하지.{0,20}(?:해지|종료)",
        "법령의 (?:제정|개정|변경)"
      ],
      "context_terms": ["변경", "조정", "금리", "수수료", "서비스"],
      "legal_basis_candidates": ["약관의 규제에 관한 법률 제10조", "약관의 규제에 관한 법률 제6조"]
    },
    {
      "id": "R05_ACCELERATION",
      "name": "기한의 이익의 과도한 상실",
      "category": "acceleration",
      "priority": 1,
      "positive_patterns": [
        "(?:은행|채권자).{0,25}(?:필요하다고 인정|판단)하는 경우.{0,30}(?:기한의 이익을 상실|즉시 변제)",
        "(?:신용상태가 악화|기타 사유).{0,30}(?:기한의 이익을 상실|즉시 변제)",
        "어떠한 사유로든.{0,30}(?:기한의 이익을 상실|즉시 변제)"
      ],
      "negative_patterns": [
        "상당한 기간을 정하여.{0,20}(?:이행|시정)을 최고",
        "연체한 경우.{0,30}서면으로 통지",
        "회생절차|파산절차"
      ],
      "context_terms": ["기한의 이익", "즉시 변제", "신용상태"],
      "legal_basis_candidates": ["약관의 규제에 관한 법률 제9조", "약관의 규제에 관한 법률 제6조"]
    },
    {
      "id": "R08_EXCLUSIVE_JURISDICTION",
      "name": "고객에게 불리한 전속적 재판관할",
      "category": "exclusive_jurisdiction",
      "priority": 2,
      "positive_patterns": [
        "(?:은행|회사|사업자)(?:의)? (?:본점|주사무소|영업점) 소재지.{0,30}(?:전속적|전속) 관할",
        "소송은.{0,30}(?:은행|회사|사업자).{0,20}소재지.{0,20}(?:법원에서만|전속)"
      ],
      "negative_patterns": [
        "민사소송법.{0,20}(?:정한|따른) 관할법원",
        "분쟁 발생 후.{0,20}합의",
        "고객의 주소지.{0,20}관할법원"
      ],
      "context_terms": ["관할", "법원", "소송", "소재지"],
      "legal_basis_candidates": ["약관의 규제에 관한 법률 제14조", "약관의 규제에 관한 법률 제6조"]
    },
    {
      "id": "R01_EXCESSIVE_LIQUIDATED_DAMAGES",
      "name": "과도하거나 일방적인 손해배상 예정",
      "category": "liquidated_damages",
      "priority": 1,
      "positive_patterns": [
        "(?:고객|채무자).{0,30}(?:위약금|손해배상금).{0,30}(?:전액|일체|즉시).{0,20}(?:부담|지급)",
        "손해의 발생 여부와 관계없이.{0,40}(?:위약금|손해배상)"
      ],
      "negative_patterns": ["실제 발생한 손해", "합리적으로 산정", "법령에 따른"],
      "context_terms": ["위약금", "손해배상", "고객", "즉시"],
      "legal_basis_candidates": ["약관의 규제에 관한 법률 제8조", "약관의 규제에 관한 법률 제6조"]
    },
    {
      "id": "R02_UNFAIR_TERMINATION",
      "name": "사업자의 광범위한 임의 해지",
      "category": "unfair_termination",
      "priority": 2,
      "positive_patterns": [
        "(?:은행|회사|사업자).{0,30}(?:필요하다고 인정|임의로 판단).{0,30}(?:해지|종료).{0,20}(?:할 수 있다|한다)",
        "(?:은행|회사|사업자).{0,25}언제든지.{0,30}(?:해지|종료)"
      ],
      "negative_patterns": ["고객에게 상당한 기간", "법령상 해지 사유", "고객의 동의"],
      "context_terms": ["해지", "종료", "은행", "고객"],
      "legal_basis_candidates": ["약관의 규제에 관한 법률 제9조", "약관의 규제에 관한 법률 제6조"]
    },
    {
      "id": "R03_LIMITATION_OF_LIABILITY",
      "name": "사업자 책임의 포괄적 면제",
      "category": "limitation_of_liability",
      "priority": 1,
      "positive_patterns": [
        "(?:은행|회사|사업자).{0,30}(?:어떠한|일체의).{0,20}(?:책임을 지지 않|책임이 없)",
        "(?:은행|회사|사업자)의 고의 또는 과실 여부와 관계없이.{0,30}(?:면책|책임이 없)"
      ],
      "negative_patterns": ["고의 또는 중대한 과실", "법령에서 정한 책임"],
      "context_terms": ["책임", "면책", "은행", "과실"],
      "legal_basis_candidates": ["약관의 규제에 관한 법률 제7조", "약관의 규제에 관한 법률 제6조"]
    },
    {
      "id": "R06_TRANSFER_OF_RIGHTS",
      "name": "고객 동의 없는 계약상 지위 이전",
      "category": "transfer_of_rights",
      "priority": 2,
      "positive_patterns": [
        "(?:은행|회사|사업자).{0,30}고객의 동의 없이.{0,30}(?:양도|이전|승계).{0,20}(?:할 수 있다|한다)",
        "(?:채권|계약상 지위).{0,30}(?:제3자에게|타인에게).{0,30}(?:양도|이전)"
      ],
      "negative_patterns": ["고객의 사전 동의", "법률에 따른 이전"],
      "context_terms": ["양도", "이전", "동의", "제3자"],
      "legal_basis_candidates": ["약관의 규제에 관한 법률 제11조", "약관의 규제에 관한 법률 제6조"]
    },
    {
      "id": "R07_AUTOMATIC_RENEWAL",
      "name": "고객 선택권 없는 자동 갱신",
      "category": "automatic_renewal",
      "priority": 2,
      "positive_patterns": [
        "(?:고객의 의사와 관계없이|별도 통지 없이).{0,30}(?:자동으로|자동).{0,20}(?:갱신|연장)",
        "만료일에.{0,30}(?:자동으로|자동).{0,20}(?:갱신|연장)"
      ],
      "negative_patterns": ["고객이 갱신 거절", "갱신하지 않을 의사", "사전 통지"],
      "context_terms": ["자동", "갱신", "연장", "고객"],
      "legal_basis_candidates": ["약관의 규제에 관한 법률 제9조", "약관의 규제에 관한 법률 제6조"]
    }
  ]
}
