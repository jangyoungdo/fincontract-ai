        "review_points": ["민사소송법 등 법정 관할을 인정하는지", "고객 주소지 관할법원을 선택할 수 있는지", "관할 합의가 분쟁 발생 후 개별적으로 이루어지는지"],
        "suggested_revision": "계약과 관련한 분쟁은 관련 법령이 정한 관할법원 또는 고객의 주소지를 관할하는 법원에 제기할 수 있습니다. 당사자는 분쟁 발생 후 별도로 관할법원을 합의할 수 있습니다.",
        "disclaimer": "검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."
