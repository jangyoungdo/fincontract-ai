        "possible_impact": "고객이 예측하기 어려운 시점에 잔여 채무 전액을 즉시 상환해야 할 위험이 커질 수 있습니다.",
        "review_points": ["기한의 이익 상실 사유가 중대한 채무불이행으로 한정되는지", "서면 통지와 합리적인 시정기간이 제공되는지", "파산·회생 등 즉시 조치가 필요한 예외가 구분되어 있는지"],
        "suggested_revision": "고객에게 중대한 채무불이행이 발생한 경우 은행은 그 사유를 서면으로 통지하고 14일 이상의 시정기간을 부여합니다. 고객이 그 기간 내 시정하지 않은 경우에 한하여 기한의 이익 상실을 통지할 수 있습니다.",
        "disclaimer": "검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."
      },
      "positive_patterns": [
        "(?:은행|채권자).{0,25}(?:필요하다고 인정|판단)하는 경우.{0,30}(?:기한의 이익을 상실|즉시 변제)",
        "(?:신용상태가 악화|기타 사유).{0,30}(?:기한의 이익을 상실|즉시 변제)",
        "어떠한 사유로든.{0,30}(?:기한의 이익을 상실|즉시 변제)"
