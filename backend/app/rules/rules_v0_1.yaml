    {
      "id": "R04_UNILATERAL_CHANGE",
      "name": "사업자의 일방적 계약내용 변경",
      "category": "unilateral_change",
      "priority": 2,
      "explanation": {
        "why_flagged": "사업자가 객관적 사유나 고객의 선택 절차 없이 계약 내용·금리·수수료·서비스를 일방적으로 변경할 수 있는 구조가 탐지되었습니다.",
        "possible_impact": "고객이 계약 당시 예상하지 못한 비용이나 서비스 조건을 부담하고도 변경을 거절하기 어려울 수 있습니다.",
        "review_points": ["변경 사유가 법령 변경 등 객관적으로 한정되는지", "변경 전 충분한 통지 기간과 방법이 정해져 있는지", "불리한 변경을 거절하거나 위약금 없이 종료할 선택권이 있는지"],
        "suggested_revision": "법령 변경 등 객관적 사유가 발생한 경우에만 계약 내용을 변경할 수 있으며, 고객에게 최소 30일 전에 변경 내용과 사유를 통지합니다. 고객에게 불리한 변경에 동의하지 않는 경우 고객은 위약금 없이 계약을 종료할 수 있습니다.",
        "disclaimer": "검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."
      },
      "positive_patterns": [
        "(?:은행|회사|사업자).{0,30}(?:임의로|일방적으로|필요하다고 인정하는 경우).{0,30}(?:변경|조정).{0,10}(?:할 수 있다|한다)",
        "(?:은행|회사|사업자).{0,30}사전 통지 없이.{0,30}(?:변경|조정).{0,10}(?:할 수 있다|한다)",
        "(?:금리|수수료|서비스|계약\u0020?내용).{0,30}(?:사전 통지 없이).{0,20}(?:변경|조정)"
      ],
      "negative_patterns": [
        "고객의 명시적 동의",
        "변경에 동의하지.{0,20}(?:해지|종료)",
        "법령의 (?:제정|개정|변경)"
      ],
      "context_terms": ["변경", "조정", "금리", "수수료", "서비스"],
      "legal_basis_candidates": ["약관의 규제에 관한 법률 제10조", "약관의 규제에 관한 법률 제6조"]
    },
    {
