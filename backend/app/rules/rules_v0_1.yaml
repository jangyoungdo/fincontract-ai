{
  "ruleset_id": "loan-terms-baseline",
  "version": "0.3.0",
  "status": "experimental_unreviewed",
  "scope": "은행 여신거래기본약관 형태의 합성 한국어 조항",
  "limitations": ["법률 전문가 검토 전 실험용 위험 신호이며 위법성 판단이 아니다.", "정규식과 로컬 후보 분류는 계약 전체 문맥·개별 협상·강행규정을 판단하지 못한다."],
  "rules": [
    {"id":"R01_EXCESSIVE_LIQUIDATED_DAMAGES","name":"과도하거나 일방적인 손해배상 예정","category":"liquidated_damages","required_pattern_groups":[["위약금|손해배상금"],["전액|일체|실제 손해.*관계없이"],["고객|채무자|차주"]],"negative_patterns":["실제 발생한 손해.{0,40}입증"],"context_terms":["위약금","손해배상","고객"],"legal_basis_candidates":["약관의 규제에 관한 법률 제8조","약관의 규제에 관한 법률 제6조"],"candidate_terms":["위약금","손해배상금","실제 손해","전액 부담"],"explanation":{"why_flagged":"실제 손해와 무관한 위약금 또는 손해배상 부담 구조가 탐지되었습니다.","possible_impact":"고객이 예측하기 어려운 금전 부담을 질 수 있습니다.","review_points":["실제 발생하고 입증된 손해와 연계되는지","산정 기준과 상한이 공개되는지"],"suggested_revision":"고객의 책임은 객관적으로 입증된 직접 손해의 합리적 범위로 한정합니다.","disclaimer":"검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."}},
    {"id":"R02_UNFAIR_TERMINATION","name":"사업자의 광범위한 임의 해지","category":"unfair_termination","required_pattern_groups":[["해지|종료"],["필요하다고 인정|임의로 판단|언제든지"],["은행|회사|사업자|채권자|금융사"]],"negative_patterns":["상당한 기간.{0,30}시정","법령상 해지 사유"],"context_terms":["해지","종료","시정"],"legal_basis_candidates":["약관의 규제에 관한 법률 제9조","약관의 규제에 관한 법률 제6조"],"candidate_terms":["언제든지 해지","임의 해지","계약 종료"],"explanation":{"why_flagged":"사업자의 포괄적 판단에 따른 해지 구조가 탐지되었습니다.","possible_impact":"고객이 예고나 시정 기회 없이 계약상 권리를 잃을 수 있습니다.","review_points":["해지 사유가 구체적이고 중대한지","통지와 시정 기회가 있는지"],"suggested_revision":"중대한 의무 위반을 서면 통지하고 합리적 시정기간 후에만 종료할 수 있도록 합니다.","disclaimer":"검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."}},
    {"id":"R03_LIMITATION_OF_LIABILITY","name":"사업자 책임의 포괄적 면제","category":"limitation_of_liability","required_pattern_groups":[["책임을 지지 않|책임이 없|면책"],["어떠한|일체의|고의.*관계없이"],["은행|회사|사업자|채권자|금융사"]],"negative_patterns":["고의 또는 중대한 과실","법령에서 정한 책임"],"context_terms":["책임","면책","과실"],"legal_basis_candidates":["약관의 규제에 관한 법률 제7조","약관의 규제에 관한 법률 제6조"],"candidate_terms":["책임 면제","일체 책임","면책"],"explanation":{"why_flagged":"사업자의 책임을 포괄적으로 배제하는 구조가 탐지되었습니다.","possible_impact":"고객이 손해에 대한 구제를 받기 어려울 수 있습니다.","review_points":["고의·중과실 책임이 남는지","법정 책임을 보존하는지"],"suggested_revision":"법령상 배제할 수 없는 책임과 고의·중과실 책임은 명시적으로 유지합니다.","disclaimer":"검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."}},
    {"id":"R04_UNILATERAL_CHANGE","name":"사업자의 일방적 계약내용 변경","category":"unilateral_change","required_pattern_groups":[["변경|조정"],["할 수 있|합니다|한다"],["은행|회사|사업자|채권자|금융사|대주"]],"negative_patterns":["고객의 명시적 동의","동의하지.{0,30}(해지|종료)","법령의 (제정|개정|변경)"],"context_terms":["변경","조정","금리","수수료","계약"],"legal_basis_candidates":["약관의 규제에 관한 법률 제10조","약관의 규제에 관한 법률 제6조"],"candidate_terms":["일방 변경","조건 변경","금리 변경","수수료 변경"],"explanation":{"why_flagged":"사업자가 계약 조건·금리 또는 수수료를 일방적으로 변경할 수 있는 구조가 탐지되었습니다.","possible_impact":"고객이 예상하지 못한 비용이나 조건을 부담할 수 있습니다.","review_points":["변경 사유가 객관적으로 한정되는지","사전 통지와 거절·종료 선택권이 있는지"],"suggested_revision":"객관적 사유와 사전 통지를 정하고 불리한 변경을 거절할 선택권을 제공합니다.","disclaimer":"검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."}},
    {"id":"R05_ACCELERATION","name":"기한의 이익의 과도한 상실","category":"acceleration","required_pattern_groups":[["기한의 이익.*상실|즉시.*(변제|상환)|잔여.*전부.*상환|전액.*상환"],["신용상태.*악화|기타 사유|내부지침|필요하다고.*(인정|판단)|변경.*동의하지"]],"negative_patterns":["상당한 기간.{0,30}(이행|시정)","연체한 경우.{0,40}서면.*통지","회생절차|파산절차"],"context_terms":["기한의 이익","즉시","상환","신용상태"],"legal_basis_candidates":["약관의 규제에 관한 법률 제9조","약관의 규제에 관한 법률 제6조"],"candidate_terms":["기한의 이익","즉시 상환","전액 상환","잔여 대출금"],"explanation":{"why_flagged":"포괄적 사유에 따른 기한의 이익 상실 또는 전액상환 요구 구조가 탐지되었습니다.","possible_impact":"고객이 예측하기 어려운 시점에 잔여 채무 전액을 상환해야 할 수 있습니다.","review_points":["사유가 중대한 채무불이행으로 한정되는지","시정기간과 통지가 제공되는지"],"suggested_revision":"중대한 채무불이행을 통지하고 합리적 시정기간 후에만 기한의 이익 상실을 통지합니다.","disclaimer":"검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."}},
    {"id":"R06_TRANSFER_OF_RIGHTS","name":"고객 동의 없는 계약상 지위 이전","category":"transfer_of_rights","required_pattern_groups":[["양도|이전|승계"],["고객.*동의 없이|채무자.*동의 없이|제3자|타인"],["채권|계약상 지위|은행|회사|사업자|채권자"]],"negative_patterns":["고객의 사전 동의","법률에 따른 이전"],"context_terms":["양도","이전","동의","제3자"],"legal_basis_candidates":["약관의 규제에 관한 법률 제11조","약관의 규제에 관한 법률 제6조"],"candidate_terms":["채권 양도","계약 이전","제3자 이전"],"explanation":{"why_flagged":"고객 동의 없는 계약상 지위 또는 채권 이전 구조가 탐지되었습니다.","possible_impact":"계약 상대방과 이행 환경이 불리하게 바뀔 수 있습니다.","review_points":["사전 통지와 필요한 동의가 있는지","고객 조건이 불리해지지 않는지"],"suggested_revision":"이전 대상·사유·효과를 사전 통지하고 필요한 동의를 받도록 합니다.","disclaimer":"검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."}},
    {"id":"R07_AUTOMATIC_RENEWAL","name":"고객 선택권 없는 자동 갱신","category":"automatic_renewal","required_pattern_groups":[["자동(으로)?|자동 갱신"],["갱신|연장"],["만료일|고객의 의사와 관계없이|별도 통지 없이"]],"negative_patterns":["고객.*갱신 거절","갱신하지 않을 의사","사전 통지"],"context_terms":["자동","갱신","연장","고객"],"legal_basis_candidates":["약관의 규제에 관한 법률 제9조","약관의 규제에 관한 법률 제6조"],"candidate_terms":["자동 갱신","자동 연장","만료일"],"explanation":{"why_flagged":"고객 선택권이 불명확한 자동 갱신 구조가 탐지되었습니다.","possible_impact":"고객이 원하지 않는 기간이나 비용을 추가 부담할 수 있습니다.","review_points":["갱신 전 통지와 거절 방법이 있는지","갱신 후 해지 방법이 합리적인지"],"suggested_revision":"갱신 예정일 전에 조건과 거절 방법을 알리고 간편한 거절 절차를 제공합니다.","disclaimer":"검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."}},
    {"id":"R08_EXCLUSIVE_JURISDICTION","name":"고객에게 불리한 전속적 재판관할","category":"exclusive_jurisdiction","required_pattern_groups":[["전속적?\\s*관할|전속\\s*관할법원|법원에서만"],["소재지|본점|주사무소|영업점"],["은행|회사|사업자|채권자|금융사"]],"negative_patterns":["민사소송법.{0,30}(정한|따른) 관할법원","분쟁 발생 후.{0,30}합의","고객의 주소지.{0,30}관할법원"],"context_terms":["관할","법원","소송","소재지"],"legal_basis_candidates":["약관의 규제에 관한 법률 제14조","약관의 규제에 관한 법률 제6조"],"candidate_terms":["전속 관할","전속 관할법원","소재지 법원"],"explanation":{"why_flagged":"사업자 소재지로만 재판관할을 제한하는 구조가 탐지되었습니다.","possible_impact":"고객의 권리구제 비용과 접근 부담이 커질 수 있습니다.","review_points":["법정 관할과 고객 주소지 선택권이 남는지","분쟁 후 개별 합의가 가능한지"],"suggested_revision":"관련 법령의 관할법원 또는 고객 주소지 관할법원을 선택할 수 있도록 합니다.","disclaimer":"검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."}},
    {"id":"R09_EXCESSIVE_FEES_OR_RATE","name":"과도한 수수료 또는 가산금리","category":"excessive_fees_or_rate","required_pattern_groups":[["중도상환수수료|정액비용|행정비용|가산금리"],["부담|지급|부과|적용|취소"],["고객|채무자|차주|대출"]],"negative_patterns":["실비.*증빙","합리적인 산정"],"context_terms":["수수료","가산금리","비용","부담"],"legal_basis_candidates":["약관의 규제에 관한 법률 제6조","약관의 규제에 관한 법률 제8조"],"candidate_terms":["중도상환수수료","정액비용","행정비용","가산금리"],"explanation":{"why_flagged":"수수료·정액비용 또는 가산금리 부담 구조가 탐지되었습니다.","possible_impact":"고객이 비용 산정 근거 없이 과도한 금전 부담을 질 수 있습니다.","review_points":["비용 산정 기준과 증빙이 있는지","금액 또는 비율의 상한이 있는지"],"suggested_revision":"객관적 산정 기준과 증빙 가능한 실제 비용 범위를 명시합니다.","disclaimer":"검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."}},
    {"id":"R10_TYING_OR_ANCILLARY_TRANSACTION","name":"부수거래 또는 상품 결합 강제","category":"tying_or_ancillary_transaction","required_pattern_groups":[["신용카드|급여계좌|보험|부수거래"],["가입|개설|유지|이용"],["필수|하여야|요구|조건"]],"negative_patterns":["선택할 수 있","자율적으로"],"context_terms":["카드","계좌","보험","조건"],"legal_basis_candidates":["약관의 규제에 관한 법률 제6조"],"candidate_terms":["신용카드","급여계좌","보험 가입","부수거래"],"explanation":{"why_flagged":"대출과 무관한 상품·거래를 계약 조건으로 요구하는 구조가 탐지되었습니다.","possible_impact":"고객의 선택권이 제한되고 불필요한 비용이 발생할 수 있습니다.","review_points":["부수거래가 실제로 선택 가능한지","거절 시 대체 수단이 있는지"],"suggested_revision":"부수거래는 자율 선택으로 두고 대출 조건과 분리합니다.","disclaimer":"검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."}},
    {"id":"R11_DEEMED_CONSENT","name":"거절·이의 미표시에 따른 동의 간주","category":"deemed_consent","required_pattern_groups":[["동의한 것으로|동의로 간주|동의한 것으로 봄"],["거절.*표시하지 않|이의.*없으면|이의.*제기하지 않"]],"negative_patterns":["명시적으로 동의"],"context_terms":["동의","거절","이의","간주"],"legal_basis_candidates":["약관의 규제에 관한 법률 제6조"],"candidate_terms":["동의 간주","이의 없음","거절 의사"],"explanation":{"why_flagged":"고객의 침묵 또는 이의 미제기를 동의로 간주하는 구조가 탐지되었습니다.","possible_impact":"고객이 실제 의사표시 없이 불리한 변경을 부담할 수 있습니다.","review_points":["명시적 동의 절차가 있는지","충분한 통지와 응답기간이 있는지"],"suggested_revision":"고객에게 중요한 불이익 변경은 명시적 동의를 받아야 합니다.","disclaimer":"검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."}},
    {"id":"R12_RETROACTIVE_DISADVANTAGE","name":"소급적 불이익 또는 혜택 취소","category":"retroactive_disadvantage","required_pattern_groups":[["소급.*취소|소급.*적용|모두 취소"],["우대금리|우대조건|혜택|할인"]],"negative_patterns":["고객에게 유리하게","명시적 동의"],"context_terms":["소급","우대","취소","혜택"],"legal_basis_candidates":["약관의 규제에 관한 법률 제6조"],"candidate_terms":["소급 취소","우대금리","우대금리 취소","소급 적용","혜택"],"explanation":{"why_flagged":"이미 적용된 우대조건이나 혜택을 소급해 취소하는 구조가 탐지되었습니다.","possible_impact":"고객이 과거 기간의 예측하지 못한 비용을 부담할 수 있습니다.","review_points":["소급 사유와 범위가 명확한지","고객에게 사전 통지와 선택권이 있는지"],"suggested_revision":"불이익 변경은 장래에만 적용하고 사전 통지와 선택권을 제공합니다.","disclaimer":"검토용 예시이며 법률 자문이나 확정 수정안이 아닙니다."}},
