name: repository-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          python -m json.tool research/manifest.schema.json >/dev/null
          python -m json.tool research/research_manifest.example.json >/dev/null
          python -m json.tool research/demo_manifest.json >/dev/null
          python -m json.tool research/public_manifest_v0_1.json >/dev/null
          jq -e . backend/tests/fixtures/retrieval_eval_public_v0_1.jsonl >/dev/null
          jq -e . backend/tests/fixtures/expert_annotations_synthetic_v0_1.jsonl >/dev/null

      - name: Backend tests
        run: |
          python3.12 -m venv backend/.venv
          backend/.venv/bin/pip install -e 'backend[dev]'
          make test-backend

      - name: Frontend tests and build
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Validate collaboration scripts
        run: |
          bash -n scripts/setup-dev.sh
          bash -n scripts/new-worktree.sh
          bash -n scripts/check-compose.sh
          bash -n scripts/check-wsl-environment.sh
          bash -n scripts/check-compose-prereqs.sh
          bash -n scripts/prepare-local-env.sh
          bash -n scripts/run-baseline.sh
          bash -n scripts/collect-diagnostics.sh
          python -m py_compile backend/scripts/check_anthropic.py
          python -m py_compile backend/scripts/evaluate_rule_baseline.py
          python -m py_compile backend/scripts/evaluate_experts.py
          bash -n .githooks/pre-push
          test -x scripts/setup-dev.sh
          test -x scripts/new-worktree.sh
          test -x scripts/check-compose.sh
          test -x scripts/check-wsl-environment.sh
          test -x scripts/check-compose-prereqs.sh
          test -x scripts/prepare-local-env.sh
          test -x scripts/run-baseline.sh
          test -x scripts/collect-diagnostics.sh
          test -x backend/scripts/check_anthropic.py
          test -x backend/scripts/evaluate_experts.py
          test -x .githooks/pre-push

      - name: Run deterministic rule baseline tests
        run: |
          backend/.venv/bin/python -m pytest -q \
            backend/tests/test_rule_engine.py \
            backend/tests/test_model_routing.py \
            backend/tests/test_prototype_pipeline.py \
            backend/tests/test_public_corpus.py \
            backend/tests/test_retrieval.py

      - name: Check required project assets
        run: |
          test -f README.md
          test -f assets/fincontract-ai-architecture-v3.png
          test -f assets/fincontract-ai-architecture-v4.svg
          test -f assets/fincontract-ai-architecture-v4.png
          test -f prompts/project_scaffolding_prompt_v2.md
          test -f docs/architecture.md
          test -f docs/git-workflow.md
          test -f docs/windows-wsl2-handoff.md
          test -f CONTRIBUTING.md
          test -f AGENTS.md
          test -f SECURITY.md

      - name: Prevent committed local secrets and user uploads
        run: |
          test ! -f .env
          test -z "$(find storage/uploads -type f ! -name .gitkeep -print -quit)"
