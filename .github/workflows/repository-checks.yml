name: repository-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          python -m json.tool research/manifest.schema.json >/dev/null
          python -m json.tool research/research_manifest.example.json >/dev/null

      - name: Validate collaboration scripts
        run: |
          bash -n scripts/setup-dev.sh
          bash -n scripts/new-worktree.sh
          bash -n .githooks/pre-push
          test -x scripts/setup-dev.sh
          test -x scripts/new-worktree.sh
          test -x .githooks/pre-push

      - name: Run deterministic rule baseline tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py'

      - name: Check required project assets
        run: |
          test -f README.md
          test -f assets/fincontract-ai-architecture-v3.png
          test -f prompts/project_scaffolding_prompt_v2.md
          test -f docs/architecture.md
          test -f docs/git-workflow.md
          test -f CONTRIBUTING.md
          test -f AGENTS.md

      - name: Prevent committed local secrets and user uploads
        run: |
          test ! -f .env
          test -z "$(find storage/uploads -type f ! -name .gitkeep -print -quit)"
