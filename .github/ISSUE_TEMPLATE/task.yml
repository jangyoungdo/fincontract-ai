name: 작업 제안
description: 기능, 버그, 문서 또는 리서치 작업의 범위를 합의합니다.
title: "[Task] "
labels: []
body:
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      options:
        - API 및 데이터베이스
        - 문서 처리 및 PII
        - 규칙 및 RAG
        - Claude 및 근거 검증
        - Frontend
        - Infrastructure 및 CI
        - Documentation 및 Research
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: 목표
      description: 완료 후 달라져야 하는 동작을 작성하세요.
    validations:
      required: true

  - type: textarea
    id: ownership
    attributes:
      label: 예상 변경 파일과 소유 범위
      description: 다른 작업과 겹칠 수 있는 파일 또는 인터페이스를 기록하세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 테스트와 검증 가능한 조건을 작성하세요.
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: 안전성 영향
      options:
        - label: 사용자 원문 또는 PII 흐름에 영향을 줍니다.
        - label: 법률 표현 또는 판단 경계에 영향을 줍니다.
        - label: 리서치 출처, 라이선스 또는 manifest에 영향을 줍니다.
