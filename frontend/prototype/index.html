<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FinContract AI Prototype</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb}body{margin:0}.wrap{max-width:1040px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}.badge{background:#fff2cd;color:#704f00;padding:7px 10px;border-radius:20px;font-size:13px}.panel,.card{background:white;border:1px solid #dce3ef;border-radius:14px;padding:20px;margin-top:18px;box-shadow:0 5px 18px #18325a0c}textarea{box-sizing:border-box;width:100%;min-height:160px;padding:14px;border:1px solid #aab7ca;border-radius:10px;font:inherit}button,select{padding:10px 14px;border-radius:9px;border:1px solid #1b55d8;background:white;font:inherit}button.primary{background:#174ec2;color:white;border:0}button:disabled{opacity:.5}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#68758a;font-size:14px}.signal{color:#b33a18;font-weight:700}.candidate{background:#eef4ff;padding:8px;border-radius:8px;margin:6px 0}.warning{border-left:4px solid #e7a100;padding-left:10px}.hidden{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111827;color:#e5edff;padding:14px;border-radius:10px}.metric{display:inline-block;margin-right:18px}.review{margin-top:14px;border-top:1px solid #e4e9f1;padding-top:14px}@media(max-width:650px){header{display:block}.wrap{padding:18px 12px}}
  </style>
</head>
<body><div class="wrap">
  <header><div><h1>FinContract AI</h1><p class="muted">은행 여신약관 위험 신호 검토 프로토타입</p></div><div class="badge">법률 판단이 아닌 검토 보조</div></header>
  <section class="panel">
    <h2>1. 조항 입력</h2>
    <div class="row"><button onclick="demo(0)">일방 변경 예문</button><button onclick="demo(1)">기한이익 예문</button><button onclick="demo(2)">재판관할 예문</button></div>
    <p><textarea id="text" placeholder="분석할 약관 조항을 붙여넣으세요. 개인정보는 자동 마스킹됩니다."></textarea></p>
    <div class="row"><label>실험군 <select id="arm"><option value="D">D — 규칙 + mock 분석·검증</option><option value="A">A — 규칙 기준선</option></select></label><button class="primary" id="run" onclick="analyze()">분석 시작</button></div>
  </section>
  <section id="result" class="hidden"><div class="panel"><h2>2. 분석 결과</h2><div id="summary"></div><div id="warnings"></div></div><div id="cards"></div><div class="panel"><details><summary>실험 정보</summary><pre id="experiment"></pre></details></div></section>
</div><script>
const samples=["은행은 필요하다고 인정하는 경우 서비스 내용을 일방적으로 변경할 수 있다.","은행이 필요하다고 인정하는 경우 고객은 기한의 이익을 상실하고 즉시 변제한다.","본 계약에 관한 소송은 은행 본점 소재지 법원을 전속적 관할법원으로 한다."];
let current=null;function demo(i){document.querySelector('#text').value=samples[i]}
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
async function analyze(){const btn=document.querySelector('#run');btn.disabled=true;btn.textContent='검토 준비 중…';try{const r=await fetch('/api/v1/analyses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.querySelector('#text').value,experiment_arm:document.querySelector('#arm').value})});const data=await r.json();if(!r.ok)throw Error(data.message||data.error);current=data;render(data)}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent='분석 시작'}}
function render(d){document.querySelector('#result').classList.remove('hidden');document.querySelector('#summary').innerHTML=`<span class="metric"><b>${d.findings?.length||0}</b>개 검토 신호</span><span class="metric">상태 <b>${esc(d.disposition)}</b></span><span class="metric">PII 마스킹 <b>${d.document?.pii_replacement_count||0}</b>건</span>`;document.querySelector('#warnings').innerHTML=(d.warnings||[]).map(x=>`<p class="warning muted">${esc(x)}</p>`).join('');document.querySelector('#cards').innerHTML=(d.findings||[]).map((f,i)=>`<article class="card"><div class="signal">${esc(f.rule_signal.category)} · ${esc(f.rule_signal.signal_strength)}</div><h3>${esc(f.rule_signal.matched_excerpt)}</h3><p>${esc(f.assessment?.summary||f.rule_signal.rationale)}</p><h4>법적 근거 후보</h4>${f.evidence.map(e=>`<div class="candidate">${esc(e.title)} <small>· 검증 전 후보</small></div>`).join('')}<p class="muted">검증: ${esc(f.verification.status)}</p></article>`).join('')||'<div class="panel">현재 세 규칙에 해당하는 신호가 없습니다.</div>';document.querySelector('#cards').innerHTML+=`<section class="panel review"><h2>3. 사람 검토</h2><div class="row"><select id="decision"><option value="accepted">동의</option><option value="edited">수정 후 동의</option><option value="rejected">기각</option><option value="expert_review">전문가 검토 필요</option></select><input id="note" placeholder="검토 메모"><button class="primary" onclick="review()">검토 저장</button></div><p id="saved" class="muted"></p></section>`;document.querySelector('#experiment').textContent=JSON.stringify({experiment:d.experiment,versions:d.versions,usage:d.usage,elapsed_ms:d.elapsed_ms},null,2);window.scrollTo({top:document.querySelector('#result').offsetTop,behavior:'smooth'})}
async function review(){const r=await fetch(`/api/v1/analyses/${current.analysis_id}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:document.querySelector('#decision').value,note:document.querySelector('#note').value})});if(r.ok)document.querySelector('#saved').textContent='검토 결과가 현재 데모 세션에 저장되었습니다.'}
  </script></body></html>
